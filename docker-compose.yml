services:
  companytest.api:
    image: ${DOCKER_REGISTRY-}companytestapi
    ports:
      - "5000:5000" 
    build:
      context: .
      dockerfile: src/CompanyTest.API/Dockerfile
    depends_on:
      - companytest.db
  companytest.db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: companytest.db
    ports:
      - "1433:1433"
    environment:
      MSSQL_SA_PASSWORD: "testPass123"
      ACCEPT_EULA: "Y"
    volumes:
      - ./.containers/products-db:/var/lib/mssql/data
